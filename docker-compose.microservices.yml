# MERIDIAN microservices stack (generated by generate.py)
#
# Start core stack:        docker compose -f docker-compose.microservices.yml up -d --build
# + observability:         add  --profile observability
# + Kafka (not used yet):  add  --profile messaging
# + frontend:              add  --profile frontend
name: meridian-ms

services:
  # ---------------- INFRASTRUCTURE ----------------
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka is optional for now: the placeholder services don't use it yet.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    profiles: [messaging]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: [messaging]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: meridian
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    profiles: [messaging]

  # ---------------- API GATEWAY ----------------
  api-gateway:
    image: kong:3.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"   # gateway (proxy)
      - "8101:8001"   # Kong admin API (moved: 8001 belongs to device-registry)
    volumes:
      - ./services/api-gateway/kong.yml:/kong/kong.yml:ro
    depends_on:
      - device-registry
      - site-location
      - topology-engine
      - vulnerability-management
      - security-events
      - compliance-engine
      - telemetry-metrics
      - config-management
      - discovery-reconciliation
      - ipam-dhcp
      - notification-alerting
      - auth-rbac
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------- CORE SERVICES ----------------
  device-registry:
    build: ./services/device-registry
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=device-registry
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/device-registry:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  site-location:
    build: ./services/site-location
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=site-location
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/site-location:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  topology-engine:
    build: ./services/topology-engine
    environment:
      - SERVICE_NAME=topology-engine
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/topology-engine:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vulnerability-management:
    build: ./services/vulnerability-management
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=vulnerability-management
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/vulnerability-management:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  security-events:
    build: ./services/security-events
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=security-events
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/4
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/security-events:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  compliance-engine:
    build: ./services/compliance-engine
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=compliance-engine
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/5
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/compliance-engine:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  telemetry-metrics:
    build: ./services/telemetry-metrics
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=telemetry-metrics
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/6
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/telemetry-metrics:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  config-management:
    build: ./services/config-management
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=config-management
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/7
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/config-management:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  discovery-reconciliation:
    build: ./services/discovery-reconciliation
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=discovery-reconciliation
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/8
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8009:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/discovery-reconciliation:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ipam-dhcp:
    build: ./services/ipam-dhcp
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=ipam-dhcp
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/9
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ipam-dhcp:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  notification-alerting:
    build: ./services/notification-alerting
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=notification-alerting
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/10
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-}
    ports:
      - "8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notification-alerting:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  auth-rbac:
    build: ./services/auth-rbac
    environment:
      - DATABASE_URL=postgresql+asyncpg://meridian:${POSTGRES_PASSWORD:-meridian_dev}@postgres:5432/meridian
      - SERVICE_NAME=auth-rbac
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/11
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_prod}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - JWT_REFRESH_EXPIRE_DAYS=7
    ports:
      - "8012:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-rbac:/app
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------- OBSERVABILITY (profile: observability) ----------------
  jaeger:
    image: jaegertracing/all-in-one:1.53
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v2.48.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: [observability]

  grafana:
    image: grafana/grafana:10.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: [observability]
    
  newrelic-infra:
    image: newrelic/infrastructure:latest
    cap_add:
      - SYS_PTRACE
    pid: host
    privileged: true
    network_mode: host
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NRIA_DISPLAY_NAME=meridian-docker
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles: [monitoring]

  # ---------------- FRONTEND (profile: frontend) ----------------
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    profiles: [frontend]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
