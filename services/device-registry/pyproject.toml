[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-registry"
version = "0.1.0"
description = "Meridian Device Registry Service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Meridian Team", email = "team@meridian.local"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi==0.109.*",
    "uvicorn[standard]==0.27.*",
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.29.*",
    "alembic==1.13.*",
    "pydantic==2.6.*",
    "pydantic-settings==2.2.*",
    "redis==5.0.*",
    "aiokafka==0.9.*",
    "python-json-logger==2.0.*",
    "opentelemetry-api==1.22.*",
    "opentelemetry-sdk==1.22.*",
    "opentelemetry-exporter-otlp==1.22.*",
    "opentelemetry-instrumentation-fastapi==0.44.*",
    "opentelemetry-instrumentation-sqlalchemy==0.44.*",
    "opentelemetry-instrumentation-redis==0.44.*",
    "httpx==0.26.*",
    "python-dotenv==1.0.*",
    "email-validator==2.1.*",
]
[project.optional-dependencies]
dev = [
    "pytest==7.4.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==4.1.*",
    "httpx==0.26.*",
    "faker==25.0.*",
    "pytest-mock==3.12.*",
]
test = [
    "pytest==7.4.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==4.1.*",
    "httpx==0.26.*",
    "faker==25.0.*",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "S101"]
fixable = ["I", "F", "E", "W"]
format.quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]